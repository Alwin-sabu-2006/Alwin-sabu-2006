<svg xmlns="http://www.w3.org/2000/svg" width="880" height="150" viewBox="0 0 880 150" fill="none">
  <defs>
    <linearGradient id="deck_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814"/>
      <stop offset="50%" stop-color="#0e1326"/>
      <stop offset="100%" stop-color="#030610"/>
    </linearGradient>

    <linearGradient id="deck_border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="50%" stop-color="#00f5ff"/>
      <stop offset="100%" stop-color="#b026ff"/>
    </linearGradient>

    <filter id="music_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .deck-mono { font-family: 'Fira Code', 'Courier New', monospace; }
  </style>

  <!-- Player Frame -->
  <rect x="2" y="2" width="876" height="146" rx="14" fill="url(#deck_bg)" stroke="url(#deck_border)" stroke-width="1.8"/>

  <!-- Left: Glowing Album Art -->
  <g transform="translate(20, 20)">
    <rect x="0" y="0" width="110" height="110" rx="10" fill="#04060f" stroke="#00f5ff" stroke-width="1.5" filter="url(#music_glow)"/>
    <!-- Cassette / Vinyl Graphic -->
    <circle cx="55" cy="55" r="42" fill="#0b1122" stroke="#b026ff" stroke-width="1.5"/>
    <circle cx="55" cy="55" r="28" fill="#141c33" stroke="#ff007f" stroke-width="1.2"/>
    <circle cx="55" cy="55" r="14" fill="#00f5ff" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <!-- Rotating Vinyl Groove Lines -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 55 55" to="360 55 55" dur="6s" repeatCount="indefinite"/>
      <line x1="55" y1="18" x2="55" y2="28" stroke="#ffffff" opacity="0.4" stroke-width="2"/>
      <line x1="55" y1="82" x2="55" y2="92" stroke="#ffffff" opacity="0.4" stroke-width="2"/>
    </g>
  </g>

  <!-- Center: Track Info & Animated Frequency Visualizer -->
  <g transform="translate(150, 25)">
    <!-- Status & Track Title -->
    <text x="0" y="14" fill="#00f5ff" font-size="11" class="deck-mono" font-weight="bold">NOW STREAMING // CYBERDECK AUDIO ENGINE</text>
    <text x="0" y="34" fill="#ffffff" font-size="15" class="deck-mono" font-weight="bold">Night City Drift • Synthwave Lo-Fi Code Mix</text>
    <text x="0" y="52" fill="#94a3b8" font-size="12" class="deck-mono">Curated by Alwin Sabu // Frequency: 432Hz Overdrive</text>

    <!-- Animated Equalizer Bars -->
    <g transform="translate(0, 64)">
      <!-- 24 Audio Spectrum Bars with animated heights -->
      <rect x="0" y="0" width="4" height="18" rx="2" fill="#ff007f"><animate attributeName="height" values="8;24;6;20;8" dur="0.8s" repeatCount="indefinite"/><animate attributeName="y" values="16;0;18;4;16" dur="0.8s" repeatCount="indefinite"/></rect>
      <rect x="8" y="0" width="4" height="18" rx="2" fill="#ff007f"><animate attributeName="height" values="18;8;24;10;18" dur="0.7s" repeatCount="indefinite"/><animate attributeName="y" values="6;16;0;14;6" dur="0.7s" repeatCount="indefinite"/></rect>
      <rect x="16" y="0" width="4" height="18" rx="2" fill="#ffb703"><animate attributeName="height" values="12;22;8;24;12" dur="0.9s" repeatCount="indefinite"/><animate attributeName="y" values="12;2;16;0;12" dur="0.9s" repeatCount="indefinite"/></rect>
      <rect x="24" y="0" width="4" height="18" rx="2" fill="#ffb703"><animate attributeName="height" values="24;10;18;6;24" dur="0.65s" repeatCount="indefinite"/><animate attributeName="y" values="0;14;6;18;0" dur="0.65s" repeatCount="indefinite"/></rect>
      <rect x="32" y="0" width="4" height="18" rx="2" fill="#00ff66"><animate attributeName="height" values="14;24;8;20;14" dur="0.85s" repeatCount="indefinite"/><animate attributeName="y" values="10;0;16;4;10" dur="0.85s" repeatCount="indefinite"/></rect>
      <rect x="40" y="0" width="4" height="18" rx="2" fill="#00ff66"><animate attributeName="height" values="20;6;24;12;20" dur="0.75s" repeatCount="indefinite"/><animate attributeName="y" values="4;18;0;12;4" dur="0.75s" repeatCount="indefinite"/></rect>
      <rect x="48" y="0" width="4" height="18" rx="2" fill="#00f5ff"><animate attributeName="height" values="10;24;14;8;10" dur="0.6s" repeatCount="indefinite"/><animate attributeName="y" values="14;0;10;16;14" dur="0.6s" repeatCount="indefinite"/></rect>
      <rect x="56" y="0" width="4" height="18" rx="2" fill="#00f5ff"><animate attributeName="height" values="24;8;20;10;24" dur="0.7s" repeatCount="indefinite"/><animate attributeName="y" values="0;16;4;14;0" dur="0.7s" repeatCount="indefinite"/></rect>
      <rect x="64" y="0" width="4" height="18" rx="2" fill="#b026ff"><animate attributeName="height" values="12;22;6;24;12" dur="0.8s" repeatCount="indefinite"/><animate attributeName="y" values="12;2;18;0;12" dur="0.8s" repeatCount="indefinite"/></rect>
      <rect x="72" y="0" width="4" height="18" rx="2" fill="#b026ff"><animate attributeName="height" values="22;10;24;8;22" dur="0.95s" repeatCount="indefinite"/><animate attributeName="y" values="2;14;0;16;2" dur="0.95s" repeatCount="indefinite"/></rect>
      <rect x="80" y="0" width="4" height="18" rx="2" fill="#ff007f"><animate attributeName="height" values="8;24;12;20;8" dur="0.75s" repeatCount="indefinite"/><animate attributeName="y" values="16;0;12;4;16" dur="0.75s" repeatCount="indefinite"/></rect>
      <rect x="88" y="0" width="4" height="18" rx="2" fill="#ffb703"><animate attributeName="height" values="20;8;24;6;20" dur="0.85s" repeatCount="indefinite"/><animate attributeName="y" values="4;16;0;18;4" dur="0.85s" repeatCount="indefinite"/></rect>
      <rect x="96" y="0" width="4" height="18" rx="2" fill="#00f5ff"><animate attributeName="height" values="14;22;8;24;14" dur="0.7s" repeatCount="indefinite"/><animate attributeName="y" values="10;2;16;0;10" dur="0.7s" repeatCount="indefinite"/></rect>
    </g>

    <!-- Scrubber Progress Bar -->
    <g transform="translate(125, 74)">
      <text x="-40" y="10" fill="#64748b" font-size="10" class="deck-mono">02:47</text>
      <rect x="0" y="4" width="380" height="6" rx="3" fill="#1e293b"/>
      <rect x="0" y="4" width="240" height="6" rx="3" fill="#00f5ff" filter="url(#music_glow)"/>
      <circle cx="240" cy="7" r="5" fill="#ffffff" stroke="#ff007f" stroke-width="2"/>
      <text x="390" y="10" fill="#64748b" font-size="10" class="deck-mono">04:20</text>
    </g>
  </g>

  <!-- Right: Playback Buttons HUD -->
  <g transform="translate(710, 48)">
    <rect x="0" y="0" width="140" height="52" rx="8" fill="#030612" stroke="#00f5ff" stroke-opacity="0.3" stroke-width="1"/>
    <!-- Controls Icons -->
    <text x="18" y="32" fill="#94a3b8" font-size="16" class="deck-mono">⏮</text>
    <circle cx="70" cy="26" r="16" fill="#00f5ff" fill-opacity="0.15" stroke="#00f5ff" stroke-width="1.5"/>
    <text x="64" y="33" fill="#00f5ff" font-size="18" class="deck-mono">▶</text>
    <text x="104" y="32" fill="#94a3b8" font-size="16" class="deck-mono">⏭</text>
    <text x="24" y="72" fill="#00ff66" font-size="10" class="deck-mono" font-weight="bold">● LIVE 320 KBPS</text>
  </g>
</svg>
