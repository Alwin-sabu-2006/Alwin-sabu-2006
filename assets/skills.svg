<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skills_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814"/>
      <stop offset="50%" stop-color="#090f1f"/>
      <stop offset="100%" stop-color="#030610"/>
    </linearGradient>

    <!-- Neon Border -->
    <linearGradient id="skills_neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5ff">
        <animate attributeName="stop-color" values="#00f5ff;#b026ff;#ff007f;#00f5ff" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#b026ff">
        <animate attributeName="stop-color" values="#b026ff;#ff007f;#00f5ff;#b026ff" dur="7s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Bar Gradients -->
    <linearGradient id="bar_c" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="bar_py" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#ff9f1c"/>
    </linearGradient>

    <linearGradient id="bar_sh" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff66"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <linearGradient id="bar_sql" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b026ff"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <linearGradient id="bar_cs" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <linearGradient id="bar_web" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#00f5ff"/>
    </linearGradient>

    <!-- Glowing Filter -->
    <filter id="core_glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="skills_grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#00f5ff" fill-opacity="0.08"/>
    </pattern>
  </defs>

  <style>
    .code-font { font-family: 'Fira Code', 'Courier New', monospace; }
  </style>

  <!-- Frame Background -->
  <rect x="2" y="2" width="876" height="416" rx="16" fill="url(#skills_bg)" stroke="url(#skills_neon)" stroke-width="2"/>
  <rect x="2" y="2" width="876" height="416" rx="16" fill="url(#skills_grid)"/>

  <!-- Scanning Sweep -->
  <rect x="2" y="0" width="876" height="2" fill="#00f5ff" opacity="0.2">
    <animate attributeName="y" from="0" to="420" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- Title Bar -->
  <g transform="translate(30, 28)">
    <text x="0" y="0" fill="#00f5ff" font-size="14" class="code-font" font-weight="bold">// NEURAL_TECH_MATRIX.SYS</text>
    <text x="260" y="0" fill="#64748b" font-size="12" class="code-font">[QUANTUM_OVERCLOCK_ACTIVE]</text>
    <rect x="730" y="-12" width="85" height="18" rx="4" fill="#00ff66" fill-opacity="0.1" stroke="#00ff66" stroke-width="1"/>
    <text x="742" y="1" fill="#00ff66" font-size="10" class="code-font" font-weight="bold">SYNC 99.8%</text>
  </g>

  <line x1="30" y1="42" x2="850" y2="42" stroke="#00f5ff" stroke-opacity="0.2" stroke-width="1"/>

  <!-- ================= LEFT: ROTATING QUANTUM REACTOR CORE ================= -->
  <g transform="translate(130, 220)">
    <!-- Ambient Core Halo -->
    <circle cx="0" cy="0" r="85" fill="#00f5ff" fill-opacity="0.04"/>
    <circle cx="0" cy="0" r="75" stroke="#00f5ff" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="4 4"/>

    <!-- Outer Rotating Gear Ring -->
    <circle cx="0" cy="0" r="60" stroke="#b026ff" stroke-opacity="0.4" stroke-width="2" stroke-dasharray="8 6">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/>
    </circle>

    <!-- Middle Counter-Rotating Ring -->
    <circle cx="0" cy="0" r="45" stroke="#00f5ff" stroke-width="2.5" stroke-dasharray="14 10" filter="url(#core_glow)">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="8s" repeatCount="indefinite"/>
    </circle>

    <!-- Inner Core Emitter -->
    <circle cx="0" cy="0" r="24" fill="#0a1428" stroke="#ff007f" stroke-width="2"/>
    <circle cx="0" cy="0" r="14" fill="#00f5ff" filter="url(#core_glow)">
      <animate attributeName="r" values="12;16;12" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>

    <!-- Orbiting Energy Particles -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/>
      <circle cx="45" cy="0" r="3" fill="#ffb703" filter="url(#core_glow)"/>
      <circle cx="-45" cy="0" r="3" fill="#ff007f" filter="url(#core_glow)"/>
    </g>

    <!-- Core Readout Labels -->
    <text x="0" y="98" fill="#00f5ff" font-size="11" class="code-font" font-weight="bold" text-anchor="middle">ARC REACTOR CORE</text>
    <text x="0" y="114" fill="#94a3b8" font-size="9" class="code-font" text-anchor="middle">OUTPUT: 1.21 GW</text>
  </g>

  <!-- Circuit Conduits Flowing to Skills -->
  <path d="M205 130 L270 90" stroke="#00f5ff" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="4 4"/>
  <path d="M220 180 L270 145" stroke="#00f5ff" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="4 4"/>
  <path d="M220 220 L270 200" stroke="#00f5ff" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="4 4"/>
  <path d="M220 260 L270 255" stroke="#00f5ff" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="4 4"/>
  <path d="M205 310 L270 310" stroke="#00f5ff" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="4 4"/>
  <path d="M185 340 L270 365" stroke="#00f5ff" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- ================= RIGHT: HIGH-TECH SKILL MODULES ================= -->
  <g transform="translate(280, 55)">
    <!-- SKILL 1: C & Low-Level -->
    <g transform="translate(0, 15)">
      <text x="0" y="14" fill="#e2e8f0" font-size="13" class="code-font" font-weight="bold">Low-Level Systems // C</text>
      <text x="490" y="14" fill="#00f5ff" font-size="13" class="code-font" font-weight="bold">90% [CORE]</text>
      <!-- Base Slot -->
      <rect x="0" y="22" width="560" height="16" rx="4" fill="#0a0f1d" stroke="#1e293b" stroke-width="1"/>
      <!-- Filled Energy Bar -->
      <rect x="0" y="22" width="504" height="16" rx="4" fill="url(#bar_c)" filter="url(#core_glow)"/>
      <!-- Animated Shimmer Pulse -->
      <rect x="0" y="22" width="40" height="16" rx="4" fill="#ffffff" opacity="0.25">
        <animate attributeName="x" values="0;464;0" dur="3s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- SKILL 2: Python & Automation -->
    <g transform="translate(0, 70)">
      <text x="0" y="14" fill="#e2e8f0" font-size="13" class="code-font" font-weight="bold">Python &amp; Automation Engine</text>
      <text x="490" y="14" fill="#ffd166" font-size="13" class="code-font" font-weight="bold">88% [TURBO]</text>
      <rect x="0" y="22" width="560" height="16" rx="4" fill="#0a0f1d" stroke="#1e293b" stroke-width="1"/>
      <rect x="0" y="22" width="492" height="16" rx="4" fill="url(#bar_py)"/>
      <rect x="0" y="22" width="40" height="16" rx="4" fill="#ffffff" opacity="0.25">
        <animate attributeName="x" values="0;452;0" dur="3.4s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- SKILL 3: Shell & Linux Kernel -->
    <g transform="translate(0, 125)">
      <text x="0" y="14" fill="#e2e8f0" font-size="13" class="code-font" font-weight="bold">Shell Scripting &amp; Ubuntu Kernel</text>
      <text x="490" y="14" fill="#00ff66" font-size="13" class="code-font" font-weight="bold">85% [ROOT]</text>
      <rect x="0" y="22" width="560" height="16" rx="4" fill="#0a0f1d" stroke="#1e293b" stroke-width="1"/>
      <rect x="0" y="22" width="476" height="16" rx="4" fill="url(#bar_sh)"/>
      <rect x="0" y="22" width="40" height="16" rx="4" fill="#ffffff" opacity="0.25">
        <animate attributeName="x" values="0;436;0" dur="2.8s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- SKILL 4: SQL & Data Architecture -->
    <g transform="translate(0, 180)">
      <text x="0" y="14" fill="#e2e8f0" font-size="13" class="code-font" font-weight="bold">SQL &amp; Relational Databases</text>
      <text x="490" y="14" fill="#b026ff" font-size="13" class="code-font" font-weight="bold">80% [SYNAPSE]</text>
      <rect x="0" y="22" width="560" height="16" rx="4" fill="#0a0f1d" stroke="#1e293b" stroke-width="1"/>
      <rect x="0" y="22" width="448" height="16" rx="4" fill="url(#bar_sql)"/>
      <rect x="0" y="22" width="40" height="16" rx="4" fill="#ffffff" opacity="0.25">
        <animate attributeName="x" values="0;408;0" dur="3.2s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- SKILL 5: C# & Software Engineering -->
    <g transform="translate(0, 235)">
      <text x="0" y="14" fill="#e2e8f0" font-size="13" class="code-font" font-weight="bold">C# &amp; Object Architecture</text>
      <text x="490" y="14" fill="#ff007f" font-size="13" class="code-font" font-weight="bold">75% [LOGIC]</text>
      <rect x="0" y="22" width="560" height="16" rx="4" fill="#0a0f1d" stroke="#1e293b" stroke-width="1"/>
      <rect x="0" y="22" width="420" height="16" rx="4" fill="url(#bar_cs)"/>
      <rect x="0" y="22" width="40" height="16" rx="4" fill="#ffffff" opacity="0.25">
        <animate attributeName="x" values="0;380;0" dur="3.6s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- SKILL 6: Web & Interface Systems -->
    <g transform="translate(0, 290)">
      <text x="0" y="14" fill="#e2e8f0" font-size="13" class="code-font" font-weight="bold">HTML5 / CSS3 &amp; Web Systems</text>
      <text x="490" y="14" fill="#06b6d4" font-size="13" class="code-font" font-weight="bold">78% [MATRIX]</text>
      <rect x="0" y="22" width="560" height="16" rx="4" fill="#0a0f1d" stroke="#1e293b" stroke-width="1"/>
      <rect x="0" y="22" width="436" height="16" rx="4" fill="url(#bar_web)"/>
      <rect x="0" y="22" width="40" height="16" rx="4" fill="#ffffff" opacity="0.25">
        <animate attributeName="x" values="0;396;0" dur="2.9s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>